name: Probar SofaScore

# Prueba a mano si SofaScore responde desde los servidores de GitHub (desde la nube de Claude, api.sofascore.com da 403).
# No cambia nada del repositorio: deja el resultado como anotaciones de la corrida.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar SofaScore
        run: |
          U="https://api.sofascore.app/api/v1/player/924889/events/last/0"
          while IFS='|' read -r nombre ua; do
            r=$(curl -sS --compressed -o out.json -w "%{http_code} %{size_download}B" -m 20 -A "$ua" -H "Accept: application/json" "$U" || echo "fallo")
            echo "::notice title=SofaScore app ($nombre)::$r $(head -c 100 out.json | tr -d '\n')"
          done <<'LISTA'
          okhttp|okhttp/4.12.0
          android|SofaScore/25.10.1 (Android 14; Pixel 8)
          ios|SofaScore/25.10.1 (iPhone; iOS 18.0; Scale/3.00)
          dalvik|Dalvik/2.1.0 (Linux; U; Android 14; Pixel 8 Build/AP2A.240905.003)
          LISTA
          code=$(curl -sS --compressed -o out.json -w "%{http_code} %{size_download}B" -m 20 "https://api.sofascore.com/api/v1/player/924889/events/last/0" -A "okhttp/4.12.0")
          echo "::notice title=SofaScore com (okhttp)::$code $(head -c 100 out.json | tr -d '\n')"
