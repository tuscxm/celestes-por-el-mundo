name: Infografías diarias

on:
  schedule:
    # 21:30 UTC = 18:30 en Uruguay (UTC-3, sin horario de verano)
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha puntual AAAA-MM-DD (vacío = hoy y ayer)"
        required: false
        default: ""
      clave:
        description: "Solo un jugador: valverde, bernal, mourino o araujo (vacío = todos)"
        required: false
        default: ""
      forzar:
        description: "Rehacer aunque ya esté procesado"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: infografias
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Montevideo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automatizacion/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r automatizacion/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-inter >/dev/null
          mkdir -p ~/.config/fontconfig
          cp automatizacion/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null

      - name: Revisar partidos y armar infografías
        run: |
          ARGS="--procesados automatizacion/procesados.json --salida salida_hoy"
          if [ -n "${{ inputs.fecha }}" ]; then ARGS="$ARGS --fecha ${{ inputs.fecha }}"; else ARGS="$ARGS --dias 2"; fi
          if [ -n "${{ inputs.clave }}" ]; then ARGS="$ARGS --clave ${{ inputs.clave }}"; fi
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          python automatizacion/infografia_sofascore.py automatizacion/jugadores.json $ARGS

      - name: Guardar en el repositorio y actualizar la galería
        run: |
          python automatizacion/publicar.py salida_hoy
          git config user.name "infografias-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A salida mapas automatizacion/procesados.json automatizacion/ultima_revision.json README.md
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -q -m "Revisión $(date +'%Y-%m-%d %H:%M')"
            git pull -q --rebase && git push -q
          fi

      - name: Avisar (issue + mail)
        if: hashFiles('salida_hoy/aviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat salida_hoy/aviso_titulo.txt)" --body-file salida_hoy/aviso.md

      - name: Avisar si algo falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ La revisión diaria de infografías falló" --body "@${{ github.repository_owner }}

          La corrida no pudo terminar (puede ser que SofaScore no respondió o que falló el script). Nada se publicó.

          Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
