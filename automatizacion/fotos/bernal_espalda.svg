<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 868" width="320" height="868" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#235f42"/><stop offset=".55" stop-color="#143b28"/><stop offset="1" stop-color="#0b2318"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#9fd4f5" stop-opacity=".35"/><stop offset="1" stop-color="#9fd4f5" stop-opacity="0"/>
    </radialGradient>
    <!-- rayas verticales verdiblancas -->
    <pattern id="str" width="44" height="10" patternUnits="userSpaceOnUse" x="6">
      <rect width="44" height="10" fill="#f3f6f3"/><rect width="22" height="10" fill="#0a8b47"/>
    </pattern>
    <!-- volumen de la tela -->
    <linearGradient id="shadeX" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".22" stop-color="#000" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".10"/><stop offset=".8" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="shadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".15"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#6b4a36"/><stop offset=".5" stop-color="#a87a5c"/><stop offset="1" stop-color="#5e4030"/>
    </linearGradient>
    <radialGradient id="hair" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#3a2a20"/><stop offset="1" stop-color="#140d09"/>
    </radialGradient>
    <clipPath id="torso">
      <path d="M48 372 Q60 318 118 300 L140 292 Q160 300 180 292 L202 300 Q260 318 272 372 L286 520 L300 868 L20 868 L34 520 Z"/>
    </clipPath>
    <path id="arc" d="M86 470 Q160 432 234 470"/>
  </defs>

  <rect width="320" height="868" fill="url(#bg)"/>
  <rect width="320" height="868" fill="url(#spot)"/>

  <!-- brazos -->
  <path d="M52 380 Q22 470 18 600 L16 868 L58 868 L66 600 Q74 500 92 420 Z" fill="url(#skin)"/>
  <path d="M268 380 Q298 470 302 600 L304 868 L262 868 L254 600 Q246 500 228 420 Z" fill="url(#skin)"/>
  <!-- mangas -->
  <path d="M48 372 Q26 430 22 500 L74 512 Q80 450 96 400 Z" fill="url(#str)"/>
  <path d="M272 372 Q294 430 298 500 L246 512 Q240 450 224 400 Z" fill="url(#str)"/>
  <path d="M22 494 L74 506 L72 520 L20 508 Z" fill="#0a8b47"/>
  <path d="M298 494 L246 506 L248 520 L300 508 Z" fill="#0a8b47"/>
  <path d="M48 372 Q26 430 22 500 L74 512 Q80 450 96 400 Z" fill="url(#shadeX)" opacity=".7"/>
  <path d="M272 372 Q294 430 298 500 L246 512 Q240 450 224 400 Z" fill="url(#shadeX)" opacity=".7"/>

  <!-- cuello y nuca -->
  <path d="M132 250 Q160 262 188 250 L192 300 Q160 312 128 300 Z" fill="url(#skin)"/>
  <!-- cabeza de espaldas -->
  <ellipse cx="160" cy="196" rx="54" ry="64" fill="url(#skin)"/>
  <path d="M106 196 Q104 132 160 128 Q216 132 214 196 Q214 232 196 252 Q180 236 160 236 Q140 236 124 252 Q106 232 106 196 Z" fill="url(#hair)"/>
  <!-- orejas -->
  <ellipse cx="105" cy="206" rx="8" ry="15" fill="#8a6148"/>
  <ellipse cx="215" cy="206" rx="8" ry="15" fill="#8a6148"/>
  <!-- textura de pelo -->
  <g stroke="#000" stroke-opacity=".25" stroke-width="1.4" fill="none">
    <path d="M130 150 Q150 170 140 210"/><path d="M160 140 Q170 175 160 220"/><path d="M190 150 Q176 175 182 212"/>
  </g>

  <!-- camiseta -->
  <g clip-path="url(#torso)">
    <rect x="0" y="280" width="320" height="600" fill="url(#str)"/>
    <!-- pliegues -->
    <g stroke="#000" stroke-opacity=".12" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M70 560 Q110 620 90 760"/><path d="M250 560 Q214 640 236 780"/>
      <path d="M120 700 Q160 690 200 704"/>
    </g>
    <rect x="0" y="280" width="320" height="600" fill="url(#shadeX)"/>
    <rect x="0" y="280" width="320" height="600" fill="url(#shadeY)"/>
  </g>
  <!-- cuello de la camiseta -->
  <path d="M128 296 Q160 314 192 296 L196 306 Q160 326 124 306 Z" fill="#0a8b47"/>

  <!-- nombre y número -->
  <text font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#0b1f15" stroke="#f3f6f3" stroke-width="7" paint-order="stroke" text-anchor="middle">
    <textPath href="#arc" startOffset="50%">BERNAL</textPath>
  </text>
  <text x="160" y="640" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="190"
        fill="#0b1f15" stroke="#f3f6f3" stroke-width="10" paint-order="stroke">6</text>

  <!-- pelota bajo el brazo derecho -->
  <g transform="translate(266 742)">
    <circle r="46" fill="#f5f7f5" stroke="#0b1f15" stroke-width="2.5"/>
    <path d="M0 -18 L17 -6 L11 15 L-11 15 L-17 -6 Z" fill="#0b1f15"/>
    <path d="M0 -18 L0 -44 M17 -6 L42 -15 M11 15 L26 37 M-11 15 L-26 37 M-17 -6 L-42 -15" stroke="#0b1f15" stroke-width="2.5"/>
    <circle r="46" fill="url(#shadeX)" opacity=".6"/>
  </g>
  <!-- mano sobre la pelota -->
  <path d="M300 702 Q320 742 304 792 L288 788 Q300 748 286 712 Z" fill="url(#skin)"/>

  <rect x="0" y="826" width="320" height="42" fill="#0b2318" opacity=".75"/>
  <text x="160" y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#cfe3d4">Ilustración · no es una foto del jugador</text>
</svg>
