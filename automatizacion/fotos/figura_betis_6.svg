<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 868" width="320" height="868" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a3d"/>
      <stop offset=".6" stop-color="#143b28"/>
      <stop offset="1" stop-color="#0d2a1c"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#7cc4f0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7cc4f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="34" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
      <rect width="34" height="40" fill="#0b8a45"/>
      <rect x="17" width="17" height="40" fill="#f4f7f4"/>
    </pattern>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#0c1f15"/><stop offset="1" stop-color="#1b3a2a"/>
    </linearGradient>
    <radialGradient id="ballg" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8d2"/>
    </radialGradient>
  </defs>
  <rect width="320" height="868" fill="url(#bg)"/>
  <rect width="320" height="868" fill="url(#spot)"/>
  <!-- líneas de velocidad -->
  <g stroke="#7cc4f0" stroke-opacity=".25" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="330" x2="70" y2="330"/><line x1="0" y1="372" x2="52" y2="372"/>
    <line x1="14" y1="560" x2="62" y2="560"/><line x1="4" y1="740" x2="70" y2="740"/>
  </g>
  <!-- sombra -->
  <ellipse cx="170" cy="812" rx="120" ry="14" fill="#000" opacity=".35"/>

