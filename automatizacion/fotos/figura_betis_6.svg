  <path d="M100 640 L76 720 L64 760 L84 766 L98 728 L122 650 Z" fill="url(#skin)"/>
  <path d="M74 730 L60 772 L88 778 L96 742 Z" fill="#0b8a45"/>
  <path d="M52 768 L92 776 L94 790 L46 784 Z" fill="#111"/>

  <!-- pierna delantera (der) -->
