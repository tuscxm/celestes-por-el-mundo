  <circle cx="166" cy="238" r="42" fill="url(#skin)"/>
  <path d="M126 228 Q130 188 168 186 Q206 188 208 226 Q190 210 166 210 Q142 210 126 228 Z" fill="#081710"/>

  <!-- pelota -->
  <g transform="translate(272 768)">
    <circle r="30" fill="url(#ballg)" stroke="#0b1f15" stroke-width="2"/>
    <path d="M0 -12 L11 -4 L7 10 L-7 10 L-11 -4 Z" fill="#0b1f15"/>
    <path d="M0 -12 L0 -29 M11 -4 L27 -10 M7 10 L17 24 M-7 10 L-17 24 M-11 -4 L-27 -10" stroke="#0b1f15" stroke-width="2"/>
