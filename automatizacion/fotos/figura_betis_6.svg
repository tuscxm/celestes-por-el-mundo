  <path d="M120 305 L82 380 L60 448 L76 454 L104 392 L140 330 Z" fill="url(#stripes)"/>
  <path d="M60 448 L48 500 L64 504 L78 454 Z" fill="url(#skin)"/>

  <!-- torso -->
  <path d="M112 290 Q165 270 216 292 L228 380 L214 476 L116 476 L104 380 Z" fill="url(#stripes)"/>
  <path d="M112 290 Q165 270 216 292 L228 380 L214 476 L116 476 L104 380 Z" fill="none" stroke="#0a2a1a" stroke-width="2" opacity=".5"/>
  <!-- cuello -->
  <path d="M146 282 L184 282 L178 300 L152 300 Z" fill="#0b8a45"/>
  <!-- número -->
  <rect x="146" y="342" width="40" height="56" rx="8" fill="#0b8a45" opacity=".9"/>
  <text x="166" y="389" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="46" fill="#f4f7f4">6</text>

