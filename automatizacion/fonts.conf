<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- En GitHub Actions no están Helvetica Neue ni Arial Black: se usa Inter para que se vea igual que en las pruebas. -->
<fontconfig>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Arial Black</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
